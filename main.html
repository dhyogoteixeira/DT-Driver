<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DT Driver — Solicitar Corrida</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        /* --- ESTILOS GERAIS E LAYOUT (DARK MODE) --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #121212; /* Fundo escuro */
            color: #E0E0E0; /* Texto claro */
        }
        header {
            padding: 20px 5%;
            font-size: 24px;
            color: #00aaff;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px 5%;
            gap: 30px;
        }
        .formulario, .resumo {
            background: #1F1F1F;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .formulario {
            flex: 2;
            min-width: 300px;
        }
        .resumo {
            flex: 1;
            min-width: 250px;
            max-height: 700px; /* Limita a altura do painel de resumo */
            position: sticky;
            top: 20px;
        }

        /* --- ESTILOS DE FORMULÁRIO --- */
        label, input, textarea, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #252525;
            color: #E0E0E0;
            font-size: 16px;
        }
        input::placeholder, textarea::placeholder {
            color: #888;
        }
        
        /* Botões */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        #btnCalcular {
            background: #00aaff;
            color: #1F1F1F;
        }

            background: #00c853; /* Verde para solicitação
